# Inactive on purpose: GitHub only runs workflows from .github/workflows/.
# How to turn it on: docs/ci-cd.md
name: Release

# Every commit carries its own version (package.json and CHANGELOG.md). This only publishes it, after CI
# finishes on main, so a tag is only created for a commit that passed every check.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and GitHub Release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # A `content:` commit made by the admin panel keeps the version of the commit before it: nothing to publish.
      - name: Publish the version of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(bun --print "require('./package.json').version")"
          if git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already published."
            exit 0
          fi
          bun scripts/release.ts --section "$VERSION" --notes "$RUNNER_TEMP/release-notes.md"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" $PRERELEASE
