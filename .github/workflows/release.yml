name: Release

# A stable tag vX.Y.Z publishes the GitHub Release (notes from CHANGELOG.md) and the container image
# (infra/Dockerfile) to GHCR and Docker Hub. Pre-release tags (vX.Y.Z-rc.1) do nothing.
# Needs the repository variables SITE_URL and DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bun scripts/release.ts --section "${TAG#v}" --notes "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag

  image:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GHCR_IMAGE: ghcr.io/alexgalhardo/eletro
      HUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/eletro
      TAG: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore OIDC identity for cosign and attestations
      attestations: write # build provenance attestation of the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the image tags
        id: meta
        run: |
          version="${TAG#v}"
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "tags<<EOF"
            for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
              echo "$image:$version"
              echo "$image:${version%.*}"
              echo "$image:latest"
            done
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"
          cosign sign --yes "$HUB_IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/alexgalhardo/eletro
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
