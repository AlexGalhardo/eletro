# Local run of the production build. Use it through setups/setup-*-with-docker.sh, or directly:
#   docker compose --file infra/docker-compose.yml up --build --detach --wait
name: sveltekit-blog-cms

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: sveltekit-blog-cms:local
    # Runtime configuration only: the image is built without any of these values.
    env_file:
      - path: ../.env
        required: false
    environment:
      PGLITE_DIR: /app/.data/pglite
    ports:
      # Published on this machine only: the local sign-in must not be reachable from the network.
      - "127.0.0.1:${APP_PORT:-8080}:4173"
    volumes:
      - data:/app/.data
    restart: unless-stopped

volumes:
  data:
