# Static site served by Caddy. Local, or on a VPS behind a TLS reverse proxy:
#   docker compose --file infra/docker-compose.yml up --build --detach --wait
# SITE_URL is baked into the build (canonicals, sitemap); set it to the public origin before building for a VPS.
name: eletro

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
    image: eletro:local
    ports:
      # Loopback only: put a reverse proxy with TLS in front on a VPS.
      - "127.0.0.1:${APP_PORT:-8080}:80"
    restart: unless-stopped
