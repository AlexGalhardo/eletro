server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options DENY always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	# Pages are written as /slug/index.html; `trailingSlash: "never"` keeps links without the slash.
	location / {
		try_files $uri $uri/index.html =404;
	}

	# `expires` instead of add_header: an add_header here would drop the server's security headers.
	# Hashed build output never changes under the same name.
	location /_astro/ {
		expires 1y;
	}

	location /images/ {
		expires 7d;
	}

	error_page 404 /404.html;
}
